name: Gradle CI - Test & Lint

on:
  push:
    branches: [ main, feat/fix-latihan-1, feat/complete-exercises ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run required tests
        run: ./gradlew test --tests ExamTestMain -q

      - name: Run optional tests
        run: ./gradlew test --tests ExamTestOptional -q

      - name: Run lint
        run: ./gradlew lint

